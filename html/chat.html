<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevoltChat | Chat</title>
    <script>
        const savedTheme = localStorage.getItem('revolt_theme');
        if (savedTheme && savedTheme !== 'default') {
            document.documentElement.className = `theme-${savedTheme}`;
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>
    <div id="particles-js"></div>

    <div class="navbar">
        <div class="nav-left">
            <a href="../home.html" class="back-btn">
                <i data-lucide="arrow-left" size="20"></i>
            </a>
            <div class="nav-title">RevoltChat | Chat</div>
        </div>
        <div class="nav-mini-icons">
            <a href="profile.html"><i data-lucide="user" size="18"></i></a>
            <a href="friends.html"><i data-lucide="users" size="18"></i></a>
            <a href="gems.html"><i data-lucide="gem" size="18"></i></a>
            <a href="accounts.html"><i data-lucide="user-check" size="18"></i></a>
            <a href="settings.html"><i data-lucide="settings" size="18"></i></a>
        </div>
    </div>

    <div class="main-container">
        
        <div class="sidebar left-sidebar">
            <div class="rooms-list">
                <div class="online-header">Rooms</div>
                <div class="room active" data-room="General"><i data-lucide="hash" size="18"></i> <span>General</span></div>
                <div class="room" data-room="Gaming"><i data-lucide="gamepad-2" size="18"></i> <span>Gaming</span></div>
                <div class="room" data-room="Yap"><i data-lucide="message-square" size="18"></i> <span>Yap</span></div>
                <div class="room" data-room="GOATS"><i data-lucide="trophy" size="18"></i> <span>GOATS</span></div>
                <div class="room" data-room="REVOLTERS"><i data-lucide="flame" size="18"></i> <span>REVOLTERS</span></div>
            </div>
        </div>

        
        <div class="chat-area">
            <div id="messages-container" class="messages-container"></div>
            <div class="input-area">
                <form id="input-container">
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="send-button">Send</button>
                </form>
            </div>
        </div>

       
        <div class="sidebar right-sidebar">
            <div class="online-users">
                <div class="online-header">Revolt Counter (<span id="user-count">0</span>)</div>
                <ul id="revolt-users-list" class="users-list"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="../js/chat.js"></script>
    <script type="module" src="../js/global.js"></script>
</body>
</html>
