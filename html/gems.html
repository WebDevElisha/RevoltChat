<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevoltChat - Gems</title>
    <script>
        const savedTheme = localStorage.getItem('revolt_theme');
        if (savedTheme && savedTheme !== 'default') {
            document.documentElement.className = `theme-${savedTheme}`;
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gems.css">
</head>
<body>
    <div id="particles-js"></div>

    <div class="gems-container">
        <a href="../home.html" class="back-btn"><i data-lucide="arrow-left"></i> Back</a>
        <h1>Gems</h1>
        
        <div class="gem-box">
            <div id="days-container" class="days-grid"></div>
            <button id="collect-btn">Loading...</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="../js/global.js"></script>
    <script type="module" src="../js/gems.js"></script>
</body>
</html>
