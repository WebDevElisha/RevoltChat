<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOLT - 404 Not Found</title>
    <script>
        const savedTheme = localStorage.getItem('revolt_theme');
        if (savedTheme && savedTheme !== 'default') {
            document.documentElement.className = `theme-${savedTheme}`;
        }
    </script>
    <style>
        :root {
          --bg-color: #000000;
          --text-color: #ffffff;
          --title-color: #e60000;
          --border-color: #e60000;
          --btn-bg: #000000;
          --btn-text: #e60000;
          --header-bg: #0a0000;
          --neon-glow: 0 0 10px #e60000, inset 0 0 5px #e60000;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .error-container {
            background-color: var(--header-bg);
            padding: 50px;
            border-radius: 24px;
            width: 450px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: var(--neon-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--title-color);
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 15px var(--border-color);
            font-family: 'Fredoka', cursive, sans-serif;
        }

        .error-message {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.5;
            margin: 0;
        }

        .error-link {
            display: inline-block;
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px rgba(230, 0, 0, 0.2);
        }

        .error-link:hover {
            box-shadow: var(--neon-glow);
            background-color: var(--title-color);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Sorry, the page you are trying to access isn't owned by Revolt, or has been moved temporary to a new address.</p>
        <a href="#" id="auth-link" class="error-link">Loading...</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const segments = window.location.pathname.split('/').filter(Boolean);
        const base = window.location.hostname.endsWith('github.io') && segments.length > 0 ? `/${segments[0]}/` : '/';

        const firebaseConfig = {
            apiKey: "AIzaSyDWnr-9qpfzW_y-LMuTorItQTUHJVvhLDk",
            authDomain: "revolt-chat-4fada.firebaseapp.com",
            databaseURL: "https://revolt-chat-4fada-default-rtdb.firebaseio.com/",
            projectId: "revolt-chat-4fada",
            storageBucket: "revolt-chat-4fada.firebasestorage.app",
            messagingSenderId: "488624788181",
            appId: "1:488624788181:web:1571ba31aafb8c1441c85c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const authLink = document.getElementById('auth-link');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authLink.href = base + "home.html";
                authLink.textContent = "Back to Home";
            } else {
                authLink.href = base + "index.html";
                authLink.textContent = "Login, or Signup";
            }
        });
    </script>
</body>
</html>
